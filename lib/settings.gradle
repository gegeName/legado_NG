// Only include implemented modules; no placeholder features in the application.
def optionalFlag = { String key ->
    def value = providers.gradleProperty(key).getOrElse('true')
    if (!(value in ['true', 'false'])) throw new GradleException("$key must be true or false")
    value == 'true'
}
def modules = ['feature-api', 'feature-backup', 'source-yiciyuan', 'tts-multitts-compat', 'extension-compat', 'source-runtime', 'source-mihon', 'source-aniyomi', 'source-tvbox', 'manga-reader-support', 'manga-translation', 'video-support', 'legado-ng-adapter']
if (optionalFlag('legadoPdf')) modules += 'manga-pdf-support'
if (optionalFlag('legadoVideoEffects')) modules += 'video-player-media3'
modules.each { name ->
    include ":lib:$name"
}
