plugins {
    alias libs.plugins.android.library
    alias libs.plugins.kotlin.android
    alias libs.plugins.kotlin.serialization
}
android {
    namespace 'io.legado.features.runtime'
    compileSdk compile_sdk_version
    defaultConfig { minSdk 21; consumerProguardFiles 'consumer-rules.pro' }
    kotlin { jvmToolchain(17) }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
    api project(':lib:feature-api')
    api project(':lib:extension-compat')
    implementation libs.core.ktx
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-protobuf:1.8.0'
    testImplementation libs.junit
}
